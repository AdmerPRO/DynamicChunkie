name: Client integration tests

# Graphical client tests use software rendering; run them explicitly when needed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-tests:
    name: Client tests (${{ matrix.renderer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer: vanilla
            gradle-arguments: ''
          - renderer: sodium-modmenu
            gradle-arguments: '-PwithSodium'

    env:
      SDL_VIDEO_DRIVER: x11
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties

      - name: Install virtual display and software graphics
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgl1-mesa-dri mesa-vulkan-drivers vulkan-tools libasound2t64 libxi6 libxrandr2 libxcursor1 libxinerama1 libflite1

      - name: Run client integration tests
        env:
          GRADLE_ARGUMENTS: ${{ matrix.gradle-arguments }}
        run: |
          client_test_args=()
          if [ -n "$GRADLE_ARGUMENTS" ]; then
            client_test_args+=("$GRADLE_ARGUMENTS")
          fi
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew --no-daemon --stacktrace runClientGameTest "${client_test_args[@]}"

      - name: Upload client diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-test-results-${{ matrix.renderer }}-${{ github.sha }}
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
            build/run/clientGameTest/screenshots/
            build/reports/
          if-no-files-found: ignore
          retention-days: 14
