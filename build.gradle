plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21'
    id 'maven-publish'
}
version = '0.1.0'
group = 'dev.dynamicchunkie'
base { archivesName = 'dynamicchunkie-mc1.21.9' }
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.9'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.20.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.134.1+1.21.9'
    modCompileOnly 'maven.modrinth:sodium:mc1.21.10-0.7.3-fabric'
    modCompileOnly 'maven.modrinth:modmenu:16.0.1'
    if (providers.gradleProperty('withSodium').isPresent()) {
        modRuntimeOnly 'maven.modrinth:sodium:mc1.21.10-0.7.3-fabric'
        modRuntimeOnly 'maven.modrinth:modmenu:16.0.1'
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
test { useJUnitPlatform() }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }

// Client integration tests run separately and are never included in the distributed mod.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'dynamicchunkie-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

configurations.gametestCompileOnly.extendsFrom(configurations.compileOnly)
tasks.withType(Jar).configureEach {
    from('LICENSE') { rename { 'LICENSE_dynamicchunkie' } }
}
