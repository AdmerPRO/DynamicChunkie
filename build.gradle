plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
    id 'pmd'
}
version = '0.1.0'
group = 'dev.dynamicchunkie'
base { archivesName = 'dynamicchunkie' }
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
def securityVersions = new Properties()
file('config/security-versions.properties').withInputStream { securityVersions.load(it) }
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        def group = details.requested.group
        def module = details.requested.name
        String patched = null
        if (group == 'at.yawk.lz4' && module == 'lz4-java') patched = securityVersions.getProperty('lz4')
        if (group == 'com.google.guava' && module == 'guava') patched = securityVersions.getProperty('guava')
        if (group == 'io.netty' && module.startsWith('netty-') && !module.startsWith('netty-tcnative'))
            patched = securityVersions.getProperty('netty')
        if (group == 'org.apache.logging.log4j') patched = securityVersions.getProperty('log4j')
        if (patched != null) {
            details.useVersion(patched)
            details.because('Use the validated security patch level; keep Netty and Log4j modules aligned')
        }
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.166.2+26.3'
    compileOnly 'maven.modrinth:sodium:mc26.3-0.9.3-beta.1-fabric'
    compileOnly 'maven.modrinth:modmenu:21.0.1'
    if (providers.gradleProperty('withSodium').isPresent()) {
        runtimeOnly 'maven.modrinth:sodium:mc26.3-0.9.3-beta.1-fabric'
        runtimeOnly 'maven.modrinth:modmenu:21.0.1'
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
test { useJUnitPlatform() }
pmd {
    toolVersion = '7.28.0'
    ruleSets = []
    ruleSetFiles = files('config/pmd.xml')
    consoleOutput = true
}
tasks.withType(Pmd).configureEach {
    reports {
        xml.required = true
        html.required = true
        xml.outputLocation = layout.projectDirectory.file("tmp/pmd/${name}.xml")
        html.outputLocation = layout.projectDirectory.file("tmp/pmd/${name}.html")
    }
}

// Public Maven coordinates only. Kept separate from build so vulnerability queries stay explicit.
tasks.register('dependencyInventory') {
    def outputFile = layout.projectDirectory.file('tmp/security/dependencies.json')
    outputs.file(outputFile)
    outputs.upToDateWhen { false }
    doLast {
        def coordinates = ['compileClasspath', 'runtimeClasspath', 'testRuntimeClasspath'].collectMany { name ->
            configurations.getByName(name).incoming.resolutionResult.allComponents.collect { component ->
                def id = component.id
                id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier ?
                    [name: id.group + ':' + id.module, version: id.version] : null
            }.findAll { it != null }
        }.unique().sort { a, b -> (a.name + a.version) <=> (b.name + b.version) }
        def file = outputFile.asFile
        file.parentFile.mkdirs()
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(coordinates))
    }
}
tasks.register('secureLauncherMetadata', Exec) {
    description = 'Generate patched Minecraft 26.3 base metadata under ignored tmp/launcher; does not change installed launchers'
    group = 'verification'
    workingDir = projectDir
    commandLine 'python3', 'scripts/patch_launcher_libraries.py',
            '--input', new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/26.3/mojang_minecraft_info.json').absolutePath,
            '--output', layout.projectDirectory.file('tmp/launcher/26.3.json').asFile.absolutePath
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }

// Client integration tests run separately and are never included in the distributed mod.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'dynamicchunkie-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
loom {
    runs {
        clientGameTest {
            securityVersions.each { key, value -> vmArg "-Ddynamicchunkie.security.${key}=${value}" }
        }
    }
}

configurations.gametestCompileOnly.extendsFrom(configurations.compileOnly)
tasks.withType(Jar).configureEach {
    from('LICENSE') { rename { 'LICENSE_dynamicchunkie' } }
}

// Explicit benchmark mode uses the separate test mod; never packages fixtures into the release.
if (providers.gradleProperty('benchmark').isPresent()) {
    loom { runs { clientGameTest {
        vmArg '-Ddynamicchunkie.benchmark=true'
        ['WarmupTicks', 'SampleTicks', 'Repeats', 'Seed', 'FpsCap', 'Width', 'Height'].each { suffix ->
            def key = 'benchmark' + suffix
            if (providers.gradleProperty(key).isPresent()) vmArg '-Ddynamicchunkie.' + key + '=' + providers.gradleProperty(key).get()
        }
        vmArg '-Ddynamicchunkie.benchmarkOutput=' + layout.buildDirectory.dir('benchmarks').get().asFile.absolutePath
    } } }
}
tasks.named('processGametestResources') {
    inputs.property('benchmarkMode', providers.gradleProperty('benchmark').orElse('disabled'))
    doLast {
        if (providers.gradleProperty('benchmark').isPresent()) {
            def metadata = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(metadata)
            def workload = providers.gradleProperty('benchmark').get()
            def fixtures = [workloads: 'VisualWorkloadBenchmark', travel: 'TravelBenchmark', '': 'HotSoftBenchmark']
            if (!fixtures.containsKey(workload)) throw new GradleException("Unknown benchmark suite: " + workload)
            data.entrypoints['fabric-client-gametest'] = ['dev.dynamicchunkie.benchmark.' + fixtures[workload]]
            metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        }
    }
}
