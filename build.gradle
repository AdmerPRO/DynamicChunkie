plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21'
    id 'maven-publish'
}
version = '0.1.0'
group = 'dev.dynamicchunkie'
base { archivesName = 'dynamicchunkie-mc1.21.1' }
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.20.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.18+1.21.1'
    modCompileOnly 'maven.modrinth:sodium:mc1.21.1-0.8.13-fabric'
    modCompileOnly 'maven.modrinth:modmenu:11.0.5'
    if (providers.gradleProperty('withSodium').isPresent()) {
        modRuntimeOnly 'maven.modrinth:sodium:mc1.21.1-0.8.13-fabric'
        modRuntimeOnly 'maven.modrinth:modmenu:11.0.5'
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
test { useJUnitPlatform() }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }

tasks.withType(Jar).configureEach {
    from('LICENSE') { rename { 'LICENSE_dynamicchunkie' } }
}

if (providers.gradleProperty('smokeTest').isPresent()) {
    loom { runs { client { vmArg '-Ddynamicchunkie.smokeTest=true' } } }
}
